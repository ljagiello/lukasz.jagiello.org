name: IndexNow

# After each production deploy, ask the IndexNow search engines (Bing, Yandex,
# Seznam, Naver and others) to recrawl every page in the sitemap, so nobody has
# to submit them by hand. Google doesn't use IndexNow; it goes by the sitemap's
# lastmod.
#
# Vercel reports deploys as a commit status named "Vercel", not as GitHub
# deployments, and a successful one on a main commit is a production deploy.
# Status events only run workflows from main, so test changes to this file
# with a manual run after merging.

on:
  status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' &&
      github.event.state == 'success' &&
      contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ping IndexNow
        run: |
          # The key is the name and the content of public/<key>.txt, which
          # proves the site owns it. It isn't a secret.
          for file in public/*.txt; do
            name=$(basename "$file" .txt)
            if [[ $name =~ ^[0-9a-f]{32}$ ]]; then key=$name; fi
          done
          : "${key:?no IndexNow key file in public/}"
          # Every URL in the live sitemap, so new pages (a project, /work) get
          # submitted without editing this file. The deploy that triggered
          # this run is already live, so the sitemap is current.
          curl -sSf https://lukasz.jagiello.org/sitemap.xml \
            | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's/<\/loc>//' > urls.txt
          [ -s urls.txt ] || { echo "No URLs in the sitemap"; exit 1; }
          cat urls.txt
          jq -n --arg key "$key" --rawfile urls urls.txt '{
            host: "lukasz.jagiello.org",
            key: $key,
            keyLocation: "https://lukasz.jagiello.org/\($key).txt",
            urlList: ($urls | split("\n") | map(select(length > 0)))
          }' > request.json
          code=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @request.json)
          echo "IndexNow answered $code"
          cat response.txt
          # 200: accepted. 202: accepted, key check still pending.
          [ "$code" = 200 ] || [ "$code" = 202 ]
